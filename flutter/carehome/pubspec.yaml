name: carehome
description: "carehome-nerse"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  animated_custom_dropdown: ^3.1.1
  shared_preferences: ^2.5.4
  dartz: ^0.10.1
  http: ^1.6.0
  dio: ^5.9.0
  geocoding: ^4.0.0
  get_it: ^9.2.0
  image_picker: ^1.2.1
  file_picker: ^8.1.2
  permission_handler: ^12.0.1
  device_preview: ^1.3.1
  equatable: ^2.0.8
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: ^31.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/

# ── Paste this into your pubspec.yaml under flutter_launcher_icons ──────────
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon_round.png"          # ← use the round one

  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_round.png"

  image_path_ios: "assets/icons/app_icon_round.png"      # ← round for iOS too
  # ← keep our bg



flutter_native_splash:
  color: "#ffffff"
  color_dark: "#ffffff" # هذا السطر يمنع الخلفية السوداء في الـ Dark Mode
  image: assets/icons/splash.png
  image_dark: assets/icons/splash.png # لضمان ظهور نفس الصورة أيضاً

  android: true
  ios: true
  web: false
# ── Then run these commands ──────────────────────────────────────────────────
#
#   1. Copy the 3 PNG files into:  assets/icons/
#        - app_icon.png             (main icon  — 1024×1024)
#        - app_icon_round.png       (round icon — 1024×1024)
#        - app_icon_background.png  (adaptive background — 432×432)
#
#   2. flutter pub get
#   3. dart run flutter_launcher_icons
#
# ────────────────────────────────────────────────────────────────────────────


