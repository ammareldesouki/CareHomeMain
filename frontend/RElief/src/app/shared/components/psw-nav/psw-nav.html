<nav class="app-topnav">
  <app-toast></app-toast>
  <div class="app-topnav__inner">
    <a class="app-topnav__brand" routerLink="/psw">
      <span class="app-topnav__mark">R</span>
      <span class="app-topnav__name">Relief</span>
    </a>

    <div class="app-topnav__links">
      <a routerLink="/psw/offers" routerLinkActive="app-topnav__link--active" class="app-topnav__link">
        <i class="fa-solid fa-briefcase"></i><span>Offers</span>
      </a>
      <a routerLink="/psw/history" routerLinkActive="app-topnav__link--active" class="app-topnav__link">
        <i class="fa-solid fa-list"></i><span>History</span>
      </a>
      <a routerLink="/psw/profile" routerLinkActive="app-topnav__link--active" class="app-topnav__link">
        <span class="app-topnav__profile-wrap">
          <i class="fa-solid fa-user-gear"></i>
          @if (userProfile$ | async; as profile) {
            @if (profile.verificationStatus === 'None' || profile.verificationStatus === 'Rejected') {
              <span class="app-topnav__warn-dot"></span>
            }
          }
        </span>
        <span>Profile</span>
      </a>
    </div>

    <button (click)="onLogout()" class="app-topnav__logout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span>
    </button>
  </div>
</nav>
