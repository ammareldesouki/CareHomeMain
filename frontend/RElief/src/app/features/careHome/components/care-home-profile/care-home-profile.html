<!-- Phase G: Care Home Profile — re-skinned. -->
<app-dashboard-shell
  [sidebarItems]="sidebarItems"
  [breadcrumbs]="breadcrumbs"
  [userName]="profile.name || userName"
  userRole="Care Home"
  [userInitials]="profile.name ? profile.name.charAt(0).toUpperCase() : userInitials"
  [searchPlaceholder]="''"
>

  <div class="pf-page-h">
    <div>
      <h1 class="pf-page-h__title">Care Home Profile</h1>
      <p class="pf-page-h__sub">Manage your facility information and contact details</p>
    </div>
  </div>

  @if (isLoading) {
    <div class="pf-skeleton"></div>
  }

  @if (!isLoading) {
    <div class="pf-layout">
      <!-- Left col: General info -->
      <div class="pf-col">
        <section class="pf-card">
          <div class="pf-card__head">
            <h2 class="pf-card__title">Facility Details</h2>
          </div>
          <div class="pf-card__body">
            
            <div class="pf-fields">
              <div class="pf-field">
                <label>Facility Name</label>
                <!-- Usually we don't edit facility name here as it's set by admin/registration, but keeping it if needed -->
                <input type="text" [(ngModel)]="editModel.firstName" class="pf-input" placeholder="Facility Name Part 1" />
              </div>
              <div class="pf-field">
                <label>Additional Name</label>
                <input type="text" [(ngModel)]="editModel.lastName" class="pf-input" placeholder="Facility Name Part 2" />
              </div>
              <div class="pf-field">
                <label>Phone Number</label>
                <input type="tel" [(ngModel)]="editModel.phoneNumber" class="pf-input" />
              </div>
            </div>
            
          </div>
        </section>

        <section class="pf-card">
          <div class="pf-card__head">
            <h2 class="pf-card__title">Address</h2>
          </div>
          <div class="pf-card__body">
            <div class="pf-fields">
              <div class="pf-field">
                <label>Street Address</label>
                <input type="text" [(ngModel)]="editModel.address.street" class="pf-input" />
              </div>
              <div class="pf-field-row-2">
                <div class="pf-field">
                  <label>Apt / Unit</label>
                  <input type="number" [(ngModel)]="editModel.address.apartmentNumber" class="pf-input" />
                </div>
                <div class="pf-field">
                  <label>City</label>
                  <input type="text" [(ngModel)]="editModel.address.city" class="pf-input" />
                </div>
              </div>
              <div class="pf-field-row-2">
                <div class="pf-field">
                  <label>Province / State</label>
                  <input type="text" [(ngModel)]="editModel.address.state" class="pf-input" />
                </div>
                <div class="pf-field">
                  <label>Postal Code</label>
                  <input type="text" [(ngModel)]="editModel.address.postalCode" class="pf-input" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="pf-actions">
          <button class="pf-btn pf-btn--primary pf-btn--lg" (click)="saveProfile()" [disabled]="isSaving">
            {{ isSaving ? 'Saving…' : 'Save Changes' }}
          </button>
        </div>
      </div>

      <!-- Right col: Summary -->
      <div class="pf-col pf-col--side">
        <section class="pf-card">
          <div class="pf-card__head">
            <h2 class="pf-card__title">Current Information</h2>
          </div>
          <div class="pf-card__body">
            <div class="ch-info">
              <div class="ch-info__row">
                <span class="ch-info__k">Name</span>
                <span class="ch-info__v">{{ profile.name }}</span>
              </div>
              <div class="ch-info__row">
                <span class="ch-info__k">Email</span>
                <span class="ch-info__v">{{ profile.email || 'N/A' }}</span>
              </div>
              <div class="ch-info__row">
                <span class="ch-info__k">Phone</span>
                <span class="ch-info__v">{{ profile.phone || 'N/A' }}</span>
              </div>
              <div class="ch-info__row" style="flex-direction:column; align-items:flex-start; gap:4px">
                <span class="ch-info__k">Address</span>
                <span class="ch-info__v" style="text-align:left; line-height:1.4">{{ profile.address || 'N/A' }}</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  }

</app-dashboard-shell>
